name: Check faceplate audio graph

on:
  pull_request:
    paths:
      - "faceplate-preview/**"
      - "scripts/check-audio-graph.mjs"
      - "scripts/check-functional-baseline.mjs"
      - "README.md"
      - "docs/Functional_Baseline_v1.0.md"
      - "docs/Module_Inventory_v1.0.md"
      - ".github/workflows/check-faceplate-audio-graph.yml"

permissions:
  contents: read

jobs:
  audio-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find faceplate-preview -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check graph ownership
        run: node scripts/check-audio-graph.mjs
      - name: Check Functional Baseline v1.0 contract
        run: node scripts/check-functional-baseline.mjs
